
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recommendation App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 CineFinder</h1>
    <p>Discover your next favourite movie</p>
  </header>

  <main>
    <form id="searchForm">
      <input id="searchInput" type="text"
        placeholder="Search movies..." required>
      <button type="submit">Search</button>
    </form>

    <p id="message">Search for a movie to get started!</p>
    <section id="movieContainer" class="movies"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
